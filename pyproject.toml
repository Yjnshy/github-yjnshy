[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-toolkit"
version = "0.1.0"
description = "多平台无水印视频下载与直播自动录制工具（抖音 / B站 / 小红书等）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yjnshy" }]
keywords = ["yt-dlp", "douyin", "bilibili", "live-recorder", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# 浏览器 Cookie 提取的额外兜底（yt-dlp 已内置主力实现，可不装）
cookies = ["browser-cookie3>=0.19"]
dev = ["pytest>=8.0"]

[project.scripts]
mtk = "media_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Yjnshy/github-yjnshy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"media_toolkit.gui" = ["assets/*.html"]
